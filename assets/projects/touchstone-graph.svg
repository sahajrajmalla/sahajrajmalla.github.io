<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="tt td" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="tt">Touchstone graph</title>
  <desc id="td">A question goes to a classifier, which routes it to one of four specialist agents: science, history, literature or general. The specialist can call retrieval and web search tools and receives the results. A critique agent then either approves the answer, which goes to respond, or sends the query back to the same specialist to retry.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0396b"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#fbfaf5"/>

  <!-- retry loop (critique back to the same specialist) -->
  <path d="M665 165 V30 Q665 24 659 24 H436 Q430 24 430 30 V48" fill="none" stroke="#c0396b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="548" y="15" text-anchor="middle" font-size="13" fill="#9d2b57">retry or improve the query (same specialist)</text>

  <!-- question and classifier -->
  <rect x="10" y="172" width="100" height="56" rx="10" fill="#eef2ff" stroke="#4d7fff" stroke-width="2"/>
  <text x="60" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1f2e">Question</text>
  <path d="M110 200 H138" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="140" y="167" width="140" height="66" rx="10" fill="#e0ecff" stroke="#2255e8" stroke-width="2"/>
  <text x="210" y="196" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1a1f2e">classify_query</text>
  <text x="210" y="217" text-anchor="middle" font-size="12.5" fill="#475569">picks a subject</text>
  <path d="M280 200 H318" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- specialists -->
  <rect x="320" y="50" width="220" height="300" rx="14" fill="none" stroke="#2f9e68" stroke-width="2" stroke-dasharray="7 5"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1a1f2e" text-anchor="middle">
    <rect x="340" y="72" width="180" height="48" rx="9" fill="#e8f7ee" stroke="#2f9e68" stroke-width="2"/>
    <text x="430" y="102">science_agent</text>
    <rect x="340" y="138" width="180" height="48" rx="9" fill="#e8f7ee" stroke="#2f9e68" stroke-width="2"/>
    <text x="430" y="168">history_agent</text>
    <rect x="340" y="204" width="180" height="48" rx="9" fill="#e8f7ee" stroke="#2f9e68" stroke-width="2"/>
    <text x="430" y="234">literature_agent</text>
    <rect x="340" y="270" width="180" height="48" rx="9" fill="#e8f7ee" stroke="#2f9e68" stroke-width="2"/>
    <text x="430" y="300">general_agent</text>
  </g>

  <!-- tools -->
  <rect x="330" y="388" width="200" height="56" rx="10" fill="#fff4e0" stroke="#c9852a" stroke-width="2"/>
  <text x="430" y="412" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1a1f2e">tools</text>
  <text x="430" y="432" text-anchor="middle" font-size="12.5" fill="#475569">retrieval, web search</text>
  <path d="M392 350 V386" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M470 388 V352" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="384" y="373" text-anchor="end" font-size="12" fill="#475569">tool call</text>
  <text x="478" y="373" text-anchor="start" font-size="12" fill="#475569">results</text>

  <!-- critique and respond -->
  <path d="M540 200 H588" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="564" y="190" text-anchor="middle" font-size="12" fill="#475569">answer</text>
  <rect x="590" y="165" width="150" height="70" rx="10" fill="#fde8ef" stroke="#c0396b" stroke-width="2"/>
  <text x="665" y="196" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1a1f2e">critique_agent</text>
  <text x="665" y="217" text-anchor="middle" font-size="12.5" fill="#475569">approve or retry</text>
  <path d="M665 235 V328" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="675" y="286" text-anchor="start" font-size="12" fill="#475569">approve</text>
  <rect x="590" y="330" width="150" height="56" rx="10" fill="#eaf5dc" stroke="#5b9a2f" stroke-width="2"/>
  <text x="665" y="364" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1a1f2e">respond</text>

  <text x="10" y="452" font-size="11" fill="#64748b">Redrawn from src/retrieval_graph/graph.py</text>
</svg>
